<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RS Nexus — Global Trade CRM &amp; Business Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#07152A;--navy-900:#0A1B33;--navy-800:#0F2747;--navy-700:#163559;--navy-600:#1F4573;--navy-500:#2F5F98;
  --bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#F8FAFC;--surface-3:#EEF2F7;--line:#E1E6EE;--line-2:#ECF0F5;
  --text:#0E1A2B;--muted:#55657B;--faint:#8593A7;
  --accent:#A98750;--accent-2:#C4A56E;--accent-soft:#F4EDE0;--accent-ink:#6F5527;
  --hot:#B8321F;--hot-bg:#FBE9E5;--warm:#A86B0B;--warm-bg:#FBF0D9;--cold:#2F6396;--cold-bg:#E4EDF7;
  --risk:#7A1620;--risk-bg:#F4DEE0;--ok:#22704F;--ok-bg:#DFF1E7;--info:#1F4573;--info-bg:#E4ECF6;--neutral-bg:#EAEEF3;
  --shadow:0 1px 2px rgba(10,27,51,.05),0 4px 14px rgba(10,27,51,.05);--shadow-lg:0 12px 40px rgba(7,21,42,.22);
  --r:10px;--r-sm:7px;--sb:252px;
  --font:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#08111F;--surface:#0E1B31;--surface-2:#122240;--surface-3:#172A4C;--line:#1F3355;--line-2:#182B4A;
  --text:#E7EDF6;--muted:#9AABC3;--faint:#71839F;--accent:#C9A76C;--accent-soft:#2A2418;--accent-ink:#E3C88F;
  --hot:#F0806F;--hot-bg:#3A1A18;--warm:#E6B15A;--warm-bg:#352A12;--cold:#7FAEDD;--cold-bg:#14294A;--risk:#F19AA3;--risk-bg:#3B171C;
  --ok:#66C596;--ok-bg:#12352A;--info:#8DB4E6;--info-bg:#15294A;--neutral-bg:#182B4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13.5px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.ic.lg{width:20px;height:20px}svg.ic.sm{width:14px;height:14px}

/* ---------- shell ---------- */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
.sb{background:var(--navy-950);color:#B5C2D6;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 10px 14px;z-index:40;scrollbar-width:thin;scrollbar-color:#22385a transparent}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.mono{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;letter-spacing:.5px;font-size:15px;color:#1a1305;background:linear-gradient(135deg,#E2C58C,#A98750 55%,#D9BC84);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:#7F92AE;margin-top:2px}
.nav-g{font-size:11px;color:#6E829F;padding:14px 10px 5px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:#B5C2D6;position:relative;font-size:13px}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(255,255,255,.08);color:#fff}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2)}
[dir=rtl] .nav a.on::before{border-radius:3px 0 0 3px}
.nav .cnt{margin-inline-start:auto;font-size:11px;background:rgba(196,165,110,.2);color:#E5CFA0;padding:1px 7px;border-radius:99px}
.sb-foot{margin-top:auto;padding:12px 8px 0;font-size:11px;color:#6E829F;border-top:1px solid rgba(255,255,255,.07)}
.sb-foot b{color:#B5C2D6;font-weight:500}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px}
.top .grow{flex:1}
.search{position:relative;flex:1;max-width:440px}
.search button{width:100%;display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;color:var(--faint);cursor:pointer;text-align:start}
.search kbd{margin-inline-start:auto;font:11px var(--font);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--faint)}
.iconbtn{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn .dot{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--hot);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.demo-pill{font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:3px 9px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.user-chip{display:flex;align-items:center;gap:9px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer}
[dir=rtl] .user-chip{padding:3px 4px 3px 10px}
.user-chip small{display:block;color:var(--faint);font-size:10.5px;line-height:1.1}
.user-chip span{line-height:1.2;font-size:12.5px;font-weight:500}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy-700);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.avatar.sm{width:22px;height:22px;font-size:9.5px}.avatar.lg{width:48px;height:48px;font-size:16px}
.branch-sel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;height:34px;color:var(--muted)}
.branch-sel select{border:0;background:transparent;outline:0;font-size:12.5px;max-width:150px}
.content{padding:22px 24px 90px;max-width:1560px;width:100%;margin:0 auto}
.crumbs{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--text)}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.ph p{color:var(--muted);margin-top:3px;max-width:70ch}
.ph .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px 0}
.card>.hd h3{font-size:13.5px;font-weight:600}
.card>.hd small{color:var(--faint);font-size:12px}
.card>.hd .r{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.card>.bd{padding:14px 16px 16px}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn.pri:hover{background:var(--navy-700)}
:root[data-theme=dark] .btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1305}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1a1305}
.btn.acc:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 35%,var(--line))}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--neutral-bg);color:var(--muted);white-space:nowrap;line-height:1.6}
.badge.hot{background:var(--hot-bg);color:var(--hot)}.badge.warm{background:var(--warm-bg);color:var(--warm)}.badge.cold{background:var(--cold-bg);color:var(--cold)}
.badge.risk{background:var(--risk-bg);color:var(--risk)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.acc{background:var(--accent-soft);color:var(--accent-ink)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;letter-spacing:.2px}
.tag.fact{background:var(--info-bg);color:var(--info)}.tag.calc{background:var(--ok-bg);color:var(--ok)}.tag.rec{background:var(--accent-soft);color:var(--accent-ink)}.tag.sys{background:var(--neutral-bg);color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:600}.num{text-align:end;font-variant-numeric:tabular-nums}.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.sp{margin-inline-start:auto}.gap-s{gap:6px}
.g2,.g3,.g4,.g5,.gA{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px}
.g-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.mt{margin-top:14px}.mb{margin-bottom:14px}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:12px 0}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:3px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;color:var(--muted);font-weight:500}
.field .err{color:var(--hot);font-size:11.5px}
.inp,.sel,.txt{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);outline:0;min-height:34px}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.txt{min-height:90px;resize:vertical;line-height:1.5}
.sel{padding-inline-end:26px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
:root[data-theme=dark] .chip.on{background:var(--accent);color:#1a1305;border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:9px 13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500;font-size:13px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .n{margin-inline-start:6px;font-size:11px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--navy-800);color:#fff}
:root[data-theme=dark] .seg button.on{background:var(--accent);color:#1a1305}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.notconf{color:var(--faint);font-style:italic}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.list>.li:first-child{border-top:0;padding-top:0}
.li .grow{flex:1;min-width:0}
.li a.t{font-weight:500}
.li a.t:hover{color:var(--accent-ink);text-decoration:underline}

/* ---------- filters ---------- */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:14px}
.fbar .sel{width:auto;min-height:30px;padding:3px 26px 3px 9px;font-size:12.5px}
[dir=rtl] .fbar .sel{padding:3px 9px 3px 26px}
.fbar .lbl{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.3px;margin-top:3px;line-height:1.2}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warn .v{color:var(--hot)}
.kpi.lead{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:start;font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
table.t th.s{cursor:pointer}table.t th.s:hover{color:var(--text)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr.rw{cursor:pointer}
table.t tr.rw:hover td{background:var(--surface-2)}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:end}
.tbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.tbar .inp{max-width:260px;min-height:32px}
.pager{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pager .sp{display:flex;gap:6px}
.cell-main{display:flex;align-items:center;gap:10px;min-width:0}
.cell-main .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.cell-main .t2{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.score{display:inline-grid;place-items:center;width:34px;height:24px;border-radius:6px;font-weight:600;font-size:12px}
.score.hot{background:var(--hot-bg);color:var(--hot)}.score.warm{background:var(--warm-bg);color:var(--warm)}.score.cold{background:var(--cold-bg);color:var(--cold)}
.due.over{color:var(--hot);font-weight:500}.due.today{color:var(--warm);font-weight:500}

/* ---------- charts ---------- */
.ch{width:100%;display:block}
.ch text{font-family:var(--font);fill:var(--faint);font-size:11px}
.ch .gl{stroke:var(--line-2);stroke-width:1}
.hb{display:flex;flex-direction:column;gap:9px}
.hb .r{display:grid;grid-template-columns:minmax(80px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.hb .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb .bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:99px;background:var(--navy-600)}
.hb .r .v{font-weight:500;min-width:52px;text-align:end}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:6px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel .f{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:12.5px}
.funnel .f .b2{height:24px;border-radius:5px;background:linear-gradient(90deg,var(--navy-700),var(--navy-500));min-width:3px;transition:width .5s}
.funnel .f .rt{color:var(--faint);text-align:end;font-size:11.5px}
.map-card{background:var(--navy-950);color:#C9D5E6;border-radius:var(--r);border:1px solid var(--navy-800);overflow:hidden;position:relative}
.map-card .hd{display:flex;gap:10px;align-items:center;padding:13px 16px;color:#fff}
.map-card .hd h3{font-size:13.5px;font-weight:600}
.map-card .hd small{color:#7F92AE}
.map-card svg{display:block;width:100%;height:auto}
:is(.map-card,.lane) .arc{fill:none;stroke:var(--accent-2);stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s .15s ease-out forwards;opacity:.85}
@keyframes draw{to{stroke-dashoffset:0}}
:is(.map-card,.lane) .land{fill:#26405f}
:is(.map-card,.lane) .grat{stroke:#132a49;stroke-width:1}
:is(.map-card,.lane) .node{fill:#E2C58C;stroke:#07152A;stroke-width:2}
:is(.map-card,.lane) .node.hq{fill:#fff}
:is(.map-card,.lane) text{font-family:var(--font);font-size:12px;fill:#DCE5F2}
:is(.map-card,.lane) text.sub{fill:#9BB0CE;font-size:11px}
.map-foot{padding:0 16px 12px;font-size:11.5px;color:#7F92AE}

/* ---------- ai ---------- */
.ai-banner{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:12.5px;margin-bottom:14px}
.ai-card{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 60%,var(--surface)),var(--surface));border-radius:var(--r)}
.ai-card .hd{padding:12px 14px 0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.ai-card .bd{padding:10px 14px 14px}
.ai-mark{width:20px;height:20px;border-radius:6px;background:var(--navy-800);color:var(--accent-2);display:grid;place-items:center;flex:none}
.ai-mark svg{width:12px;height:12px}
.why li{display:flex;gap:8px;align-items:flex-start;margin:4px 0;list-style:none}
.why{padding:0;margin:0}
.why .d{font-weight:600;min-width:28px}

function hbars(rows, o = {}) { const max = Math.max(1, ...rows.map(r => r.v)); if (!rows.length) return empty('No data', 'Nothing to show for the current filters.'); return `<div class="hb">${rows.map((r, i) => `<div class="r"><span class="n" title="${esc(r.k)}">${esc(r.k)}</span><span class="bar"><i style="width:${Math.max(2, r.v / max * 100)}%;background:${r.c || o.color || 'var(--navy-600)'}"></i></span><span class="v">${(o.fmt || num)(r.v)}</span></div>`).join('')}</div>`; }
function areaChart(pts, o = {}) {
  const W = 600, H = o.h || 180, p = { l: 34, r: 8, t: 10, b: 22 }, max = Math.max(1, ...pts.map(x => x.v)) * 1.1, n = pts.length;
  if (!n) return empty('No data');
  const X = i => p.l + (n === 1 ? 0 : i * (W - p.l - p.r) / (n - 1)), Y = v => H - p.b - v / max * (H - p.t - p.b);
  const line = pts.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.v).toFixed(1)).join(' ');
  const grid = [0, .5, 1].map(f => `<line class="gl" x1="${p.l}" x2="${W - p.r}" y1="${Y(max * f / 1.1)}" y2="${Y(max * f / 1.1)}"/><text x="${p.l - 6}" y="${Y(max * f / 1.1) + 4}" text-anchor="end">${(o.fmt || num)(Math.round(max / 1.1 * f))}</text>`).join('');
  const step = Math.ceil(n / 8);
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${grid}<path d="${line} L${X(n - 1)} ${H - p.b} L${X(0)} ${H - p.b}Z" fill="var(--navy-600)" fill-opacity=".1"/><path d="${line}" fill="none" stroke="var(--navy-600)" stroke-width="2.2" stroke-linejoin="round"/>${pts.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x.v)}" r="3" fill="var(--surface)" stroke="var(--navy-600)" stroke-width="2"><title>${esc(x.k)}: ${(o.fmt || num)(x.v)}</title></circle>${i % step === 0 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(x.k)}</text>` : ''}`).join('')}</svg>`;
}
function barChart(rows, o = {}) {
  const W = 600, H = o.h || 190, p = { l: 34, t: 10, b: 34 }, max = Math.max(1, ...rows.map(r => r.v)) * 1.1, n = rows.length; if (!n) return empty('No data');
  const bw = (W - p.l - 8) / n, Y = v => H - p.b - v / max * (H - p.t - p.b);
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${[0, .5, 1].map(f => `<line class="gl" x1="${p.l}" x2="${W}" y1="${Y(max / 1.1 * f)}" y2="${Y(max / 1.1 * f)}"/><text x="${p.l - 6}" y="${Y(max / 1.1 * f) + 4}" text-anchor="end">${(o.fmt || num)(Math.round(max / 1.1 * f))}</text>`).join('')}${rows.map((r, i) => `<rect x="${p.l + i * bw + bw * .18}" y="${Y(r.v)}" width="${bw * .64}" height="${H - p.b - Y(r.v)}" rx="3" fill="${r.c || 'var(--navy-600)'}"><title>${esc(r.k)}: ${(o.fmt || num)(r.v)}</title></rect><text x="${p.l + i * bw + bw / 2}" y="${H - 18}" text-anchor="middle">${esc(String(r.k).length > 11 ? String(r.k).slice(0, 10) + '…' : r.k)}</text>`).join('')}</svg>`;
}
function donut(rows, o = {}) {
  const tot = sum(rows, r => r.v); if (!tot) return empty('No data'); let a = 0; const R = 42, C = 2 * Math.PI * R;
  const segs = rows.map((r, i) => { const l = r.v / tot * C; const s = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${r.c || PAL[i % PAL.length]}" stroke-width="18" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"><title>${esc(r.k)}: ${(o.fmt || num)(r.v)}</title></circle>`; a += l; return s; }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="128" height="128">${segs}<text x="60" y="58" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)">${(o.fmt || num)(tot)}</text><text x="60" y="72" text-anchor="middle" style="font-size:9px">${esc(o.center || 'total')}</text></svg><div class="legend" style="flex:1;min-width:140px;flex-direction:column;gap:5px">${rows.map((r, i) => `<span><i style="background:${r.c || PAL[i % PAL.length]}"></i>${esc(r.k)} <b style="color:var(--text)">${(o.fmt || num)(r.v)}</b></span>`).join('')}</div></div>`;
}
function funnel(steps) { const max = Math.max(1, steps[0].v); return `<div class="funnel">${steps.map((s, i) => `<div class="f"><span>${esc(s.label)}</span><span><div class="b2" style="width:${Math.max(1.5, s.v / max * 100)}%;opacity:${1 - i * .07}"></div></span><span class="rt"><b style="color:var(--text)">${s.f || num(s.v)}</b>${i ? ' · ' + pct(steps[i - 1].v ? s.v / steps[i - 1].v : 0) : ''}</span></div>`).join('')}</div>`; }
/* dotted trade-lane map (equirectangular crop, hand-authored land mask; schematic, not cartographic) */
const LAND = { 45: [[-10, 28], [33, 125]], 42: [[-9, 3], [8, 20], [22, 28], [41, 46], [55, 125]], 39: [[-9, 0], [12, 18], [21, 26], [27, 47], [56, 125]], 36: [[-6, 10], [27, 125]], 33: [[-10, 25], [35, 125]], 30: [[-10, 33], [35, 48], [50, 125]], 27: [[-13, 33], [36, 49], [51, 125]], 24: [[-16, 34], [38, 58], [68, 125]], 21: [[-17, 36], [39, 58], [72, 88], [92, 125]], 18: [[-16, 38], [42, 54], [73, 84], [94, 107]], 15: [[-17, 40], [43, 50], [74, 80], [97, 109]], 12: [[-16, 51], [76, 80], [99, 106]], 9: [[-13, 48], [76, 78], [80, 81], [104, 108]], 6: [[-11, 47], [100, 104], [110, 118]], 3: [[9, 46], [98, 104], [110, 118]], 0: [[9, 42], [98, 104], [109, 118]], '-3': [[12, 40]], '-6': [[12, 39]], '-9': [[13, 40]], '-12': [[13, 41]] };
function tradeMap(vals, opt = {}) {
  const W = 1000, H = 380, x0 = -25, x1 = 125, y1 = 45, y0 = -14, X = lon => (lon - x0) / (x1 - x0) * W, Y = lat => (y1 - lat) / (y1 - y0) * H;
  let dots = ''; Object.keys(LAND).forEach(lat => LAND[lat].forEach(([a, b]) => { for (let lon = Math.ceil(a / 3) * 3; lon <= b; lon += 3) dots += `<circle class="land" cx="${X(lon).toFixed(0)}" cy="${Y(+lat).toFixed(0)}" r="2.6"/>`; }));
  let grat = ''; for (let lon = -20; lon <= 120; lon += 20) grat += `<line class="grat" x1="${X(lon)}" x2="${X(lon)}" y1="0" y2="${H}"/>`; for (let lat = -10; lat <= 40; lat += 10) grat += `<line class="grat" y1="${Y(lat)}" y2="${Y(lat)}" x1="0" x2="${W}"/>`;
  const hq = gCtry('EG'), max = Math.max(1, ...Object.values(vals));
  const nodes = COUNTRIES.map(c => ({ c, x: X(c.lon), y: Y(c.lat), v: vals[c.id] || 0 }));
  const arcs = nodes.filter(n => n.c.id !== 'EG').map(n => { const h = nodes.find(m => m.c.id === 'EG'), mx = (h.x + n.x) / 2, my = Math.min(h.y, n.y) - Math.abs(h.x - n.x) * .22 - 10; return `<path class="arc" style="stroke-width:${(1 + n.v / max * 5).toFixed(1)}" d="M${h.x.toFixed(0)} ${h.y.toFixed(0)} Q${mx.toFixed(0)} ${my.toFixed(0)} ${n.x.toFixed(0)} ${n.y.toFixed(0)}"><title>Cairo HQ → ${esc(n.c.name)}: ${money(n.v)} open pipeline</title></path>`; }).join('');
  const lab = { RW: [8, 20], TZ: [10, 8], LY: [-12, -12], IN: [10, -8], MR: [10, -8], CN: [-10, -14], EG: [12, -10] };
  const pts = nodes.map(n => { const [dx, dy] = lab[n.c.id] || [8, -8], r = n.c.id === 'EG' ? 7 : 4 + Math.sqrt(n.v / max) * 8; return `<g><circle class="node ${n.c.id === 'EG' ? 'hq' : ''}" cx="${n.x.toFixed(0)}" cy="${n.y.toFixed(0)}" r="${r.toFixed(1)}"/><text x="${(n.x + dx).toFixed(0)}" y="${(n.y + dy).toFixed(0)}" ${dx < 0 ? 'text-anchor="end"' : ''}>${esc(ctryName(n.c))}</text>${opt.plain ? '' : `<text class="sub" x="${(n.x + dx).toFixed(0)}" y="${(n.y + dy + 13).toFixed(0)}" ${dx < 0 ? 'text-anchor="end"' : ''}>${n.v ? money(n.v) : '—'}</text>`}</g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trade lane map">${grat}${dots}${arcs}${pts}</svg>`;
}

function fieldH(f, v) {
  const val = v[f.k] ?? f.def ?? ''; const id = 'f_' + f.k; let inp;
  if (f.type === 'select') inp = `<select class="sel" name="${f.k}" id="${id}">${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea class="txt" name="${f.k}" id="${id}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  else inp = `<input class="inp" name="${f.k}" id="${id}" type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.ph || '')}" ${f.step ? `step="${f.step}"` : ''} ${f.dupe ? 'data-in="dupe"' : ''}>`;

const TB = {};
function table(id, cfg) { TB[id] = cfg; const st = S.tables[id] = S.tables[id] || { q: '', sort: cfg.sort || null, dir: cfg.dir || 'desc', page: 1 }; cfg.pageSize = cfg.pageSize || 12;

function tableRows(id) { const c = TB[id], st = S.tables[id]; let rows = c.rows(); if (st.q) { const q = normText(st.q); rows = rows.filter(r => normText(c.hay ? c.hay(r) : JSON.stringify(r)).includes(q)); }
  if (st.sort) { const col = c.cols.find(x => x.k === st.sort); if (col && col.v) rows = rows.slice().sort((a, b) => { const x = col.v(a), y = col.v(b); const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x ?? '').localeCompare(String(y ?? '')); return st.dir === 'asc' ? r : -r; }); } return rows; }
function tableBody(id) {
  const c = TB[id], st = S.tables[id], all = tableRows(id), pages = Math.max(1, Math.ceil(all.length / c.pageSize)); st.page = Math.min(st.page, pages); const rows = all.slice((st.page - 1) * c.pageSize, st.page * c.pageSize);

}
const pager = (id, n, pages) => { const st = S.tables[id]; return `<div class="pager"><span>${n} record${n === 1 ? '' : 's'}</span><span class="sp"><button class="btn sm" data-act="tpage" data-t="${id}" data-d="-1" ${st.page <= 1 ? 'disabled' : ''}>‹</button><span style="padding:4px 6px">${st.page} / ${pages}</span><button class="btn sm" data-act="tpage" data-t="${id}" data-d="1" ${st.page >= pages ? 'disabled' : ''}>›</button></span></div>`; };

/* ---------- export ---------- */
const csvCell = v => { v = String(v ?? '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#39;/g, "'"); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = (head, rows) => '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
async function saveFile(name, data, mime) {
  try { const dl = window.claude && await window.claude.use('downloads'); if (dl) { await dl.save({ filename: name, data }); return toast('Export ready: ' + name); } } catch (e) { if (e && e.code === 'declined') return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Exported ' + name); } catch (e) { toast('Export is unavailable in this view', 1); }
}
async function exportRows(name, head, rows, fmt) {
  if (!can('export')) return toast('Your role cannot export data', 1); audit('Exported', 'report', name, rows.length + ' rows');
  if (fmt === 'xlsx') {
    try { if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const ws = XLSX.utils.aoa_to_sheet([head, ...rows.map(r => r.map(v => String(v ?? '').replace(/<[^>]+>/g, '')))]), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Export'); const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' }); return saveFile(name + '.xlsx', new Uint8Array(out), 'application/octet-stream'); } catch (e) { toast('Excel library unavailable — exporting CSV instead', 1); }
  }
  return saveFile(name + '.csv', toCSV(head, rows), 'text/csv');
}

function findDupes(f) {
  const out = [], dg = s => String(s || '').replace(/\D/g, ''), em = normText(f.email), ph = dg(f.phone), nm = normText(f.company);
  DB.leads.forEach(l => { let why = ''; if (em && normText(l.email) === em) why = 'same email'; else if (ph.length > 6 && dg(l.phone) === ph) why = 'same phone'; else if (nm && normText(l.company) === nm) why = 'same company'; else if (nm.length > 4 && dupePct(l.company, f.company) >= .6) why = 'similar company name'; if (why) out.push({ href: '#/lead/' + l.id, label: l.company + ' (' + l.id + ')', why }); });
  DB.companies.forEach(c => { let why = ''; if (nm && normText(c.name) === nm) why = 'same company'; else if (em && normText(c.email) === em) why = 'same email'; else if (nm.length > 4 && dupePct(c.name, f.company) >= .6) why = 'similar company name'; if (why) out.push({ href: '#/company/' + c.id, label: c.name + ' (company)', why }); });
  return out.slice(0, 5);
}

    return `<div class="kcol" data-stage="${s.id}"><div class="kh"><div class="n"><span style="flex:1">${esc(stageName(s.id))}</span><span class="badge">${its.length}</span></div><div class="s">${money(val)} · ${s.prob}% prob.${avg != null ? ' · avg ' + avg + 'd' : ''}</div></div><div class="kb-body" data-drop="${s.id}">${its.sort((a, b) => (b.o ? b.o.value : b.l.estValue) - (a.o ? a.o.value : a.l.estValue)).slice(0, 40).map(i => kCard(i, can2)).join('') || '<div class="xs faint" style="padding:8px">No items</div>'}</div></div>`; }).join('')}</div>`;

function kCard(i, can2) {
  const l = i.l, o = i.o, cls = itemTemp(l, o), s = sc(l), rsk = o && isOpen(o) ? rk(o) : null;
  return `<div class="kcard ${cls}" ${can2 ? 'draggable="true"' : ''} data-kind="${i.kind}" data-id="${i.id}"><div class="t"><a href="#/${o ? 'opp/' + o.id : 'lead/' + l.id}">${esc(l.company)}</a></div><div class="m">${esc(prodName(l.productId))} · ${esc(gCtry(l.country).name)}</div><div class="f"><span class="v">${money(o ? o.value : l.estValue)}</span><span class="score ${tempCls(s.temp)}" style="height:20px;width:30px">${s.score}</span>${rsk && rsk.level !== 'Low' ? badge(rsk.level + ' risk', rsk.level === 'High' ? 'risk' : 'warm') : ''}</div><div class="f">${ownerCell(l.ownerId)}</div><div class="f"><span title="Last activity">${ic('clock', 'sm')} ${l.lastActivityAt ? ago(l.lastActivityAt) : 'none'}</span><span>${o ? 'in stage ' + stageAge(o) + 'd' : ''}</span></div><div class="f"><span>Next: ${dueLabel(l.nextFollowUp)}</span>${can2 ? `<select class="sel" style="width:auto;min-height:24px;padding:0 20px 0 6px;font-size:11px;margin-inline-start:auto" data-ch="moveCard" data-kind="${i.kind}" data-id="${i.id}" aria-label="Move"><option value="">Move…</option>${STAGES.filter(s2 => s2.id !== i.stage).map(s2 => `<option value="${s2.id}">${esc(s2.label)}</option>`).join('')}</select>` : ''}</div></div>`;
}

document.addEventListener('dragend', () => { $$('.kcard.dragging').forEach(c => c.classList.remove('dragging')); $$('.kcol.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.kcol'); if (col && S.ui.drag) { e.preventDefault(); $$('.kcol.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); } });

ACT.saveQuote = () => { const v = readForm(QF()); if (!v) return; const o = gOpp(v.oppId), n = newId('quotations', 'Q', 4), qty = +v.quantity, up = +v.unitPrice; const q = Repo.insert('quotations', { id: n, number: 'QT-2026-' + n.split('-')[1], oppId: o.id, customerId: o.companyId, contactId: o.contactId, productId: o.productId, quantity: qty, unit: o.unit, currency: 'USD', unitPrice: up, total: Math.round(qty * up * 100) / 100, incoterm: v.incoterm, destination: v.destination, validUntil: iso(v.validUntil), paymentTerms: v.paymentTerms, deliveryDays: +v.deliveryDays || 30, supplierId: o.supplierId, status: 'Draft', ownerId: S.userId, notes: v.notes, sentAt: null, branch: o.branch, demo: false }, n);
  Repo.update('opportunities', o.id, { quotationId: q.id, quantity: qty, value: q.total, destination: v.destination }, 'Updated', 'Quotation ' + q.number); audit('Quote created', 'quotations', q.id, q.number); notify('quote', 'New quotation ' + q.number, gComp(o.companyId).name, '#/quote/' + q.id); closeModal(); toast('Draft ' + q.number + ' created'); location.hash = '#/quote/' + q.id; };
VIEWS.quotes = () => `${pageHeader(esc(navLabel('quotes')), 'Quotation lifecycle from draft to acceptance.', can('create', 'quotations') ? btn(t('new_quote', 'New Quotation'), 'newQuote', { cls: 'pri', ic: 'plus' }) : '')}${filterBar()}${table('quotes', { rows: () => Q.quotes(), hay: q => [q.number, (gComp(q.customerId) || {}).name, prodName(q.productId), q.status, q.destination].join(' '), href: q => '#/quote/' + q.id, sort: 'created',

VIEWS.quote = r => {

};
ACT.qStatus = el => { const q = gQuote(el.dataset.id), s = el.dataset.s, o = gOpp(q.oppId), patch = { status: s }; if (s === 'Sent' && !q.sentAt) patch.sentAt = nowISO(); Repo.update('quotations', q.id, patch, s === 'Sent' ? 'Quote sent' : 'Updated', q.number + ' → ' + s);
  if (o && isOpen(o)) { if (s === 'Sent' && STAGE[o.stage].i < STAGE.QUOTE_SENT.i) setStage(o, 'QUOTE_SENT'); if (s === 'Negotiation' && STAGE[o.stage].i < STAGE.NEGOTIATION.i) setStage(o, 'NEGOTIATION'); if (s === 'Accepted' && STAGE[o.stage].i < STAGE.VERBAL.i) setStage(o, 'VERBAL'); if (s === 'Rejected') return askLost(reason => { setStage(o, 'LOST', { lostReason: reason }); toast('Quotation rejected; opportunity closed as lost'); render(); }); }
  if (s === 'Sent') notify('quote', 'Quotation sent: ' + q.number, (gComp(q.customerId) || {}).name, '#/quote/' + q.id); toast(q.number + ' → ' + s); render(); };
ACT.quoteDownload = el => { const q = gQuote(el.dataset.id); saveFile(q.number + '.html', '<!doctype html><meta charset="utf-8"><title>' + q.number + '</title><body style="font-family:sans-serif;padding:30px">' + $('#qdoc').outerHTML + '</body>', 'text/html'); };

/* ---------- reports ---------- */
const REPORTS = { sales: 'Sales', marketing: 'Marketing', leads: 'Leads', countries: 'Countries', products: 'Products', people: 'Salespeople', sources: 'Sources', campaigns: 'Campaigns', customers: 'Customers', suppliers: 'Suppliers', quotes: 'Quotations', deals: 'Deals', lost: 'Lost Deals', activities: 'Activities', followups: 'Follow-ups', branches: 'Branches' };
function buildReport(k) {
  const K = KPI(), L = K.leads, O = K.opps, m = money;
  const grp = (rows, keyF, name) => groupBy(rows, keyF);
  switch (k) {
    case 'sales': return { head: ['Stage', 'Opportunities', 'Value', 'Weighted'], rows: STAGES.filter(s => O.some(o => o.stage === s.id)).map(s => { const x = O.filter(o => o.stage === s.id); return [s.label, x.length, m(sum(x, o => o.value), false), m(sum(x, wOpp), false)]; }), chart: STAGES.map(s => ({ k: s.label, v: sum(O.filter(o => o.stage === s.id), o => o.value) })).filter(x => x.v) };
    case 'marketing': case 'campaigns': return { head: ['Campaign', 'Channel', 'Spend (demo)', 'Leads', 'Qualified', 'Deals', 'Revenue', 'CPL'], rows: DB.campaigns.map(c => { const s = campStats(c); return [c.name, c.channel, m(c.spend, false), s.ls.length, s.q, s.won.length, m(s.rev, false), s.cpl ? m(s.cpl, false) : '—']; }), chart: DB.campaigns.map(c => ({ k: c.name.slice(0, 22), v: campStats(c).ls.length })) };
    case 'leads': return { head: ['Lead', 'Company', 'Country', 'Product', 'Est. value', 'Source', 'Status', 'Score', 'Owner', 'Created'], rows: L.map(l => [l.id, l.company, gCtry(l.country).name, prodName(l.productId), l.estValue, l.source, l.status, sc(l).score, uName(l.ownerId), fmtD(l.createdAt, 1)]), chart: groupSum(L, l => l.status, () => 1) };
    case 'countries': return { head: ['Country', 'Leads', 'Opportunities', 'Open pipeline', 'Won revenue', 'Conversion'], rows: COUNTRIES.map(c => { const l = L.filter(x => x.country === c.id), o = O.filter(x => x.country === c.id); return [c.name, l.length, o.length, m(sum(o.filter(isOpen), x => x.value), false), m(revenueOf(o), false), pct(l.length ? o.filter(isWon).length / l.length : 0, 1)]; }), chart: groupSum(K.open, o => gCtry(o.country).name, o => o.value) };
    case 'products': return { head: ['Category', 'Leads', 'Opportunities', 'Open pipeline', 'Won revenue'], rows: CATS.map(c => { const l = L.filter(x => x.cat === c.id), o = O.filter(x => x.cat === c.id); return [c.name, l.length, o.length, m(sum(o.filter(isOpen), x => x.value), false), m(revenueOf(o), false)]; }).filter(r => r[1] || r[2]), chart: groupSum(K.open, o => gCat(o.cat).name, o => o.value) };
    case 'people': return { head: ['Salesperson', 'Leads', 'Open opps', 'Open pipeline', 'Won revenue', 'Overdue follow-ups'], rows: salesUsers().map(u => [u.name, L.filter(l => l.ownerId === u.id).length, K.open.filter(o => o.ownerId === u.id).length, m(sum(K.open.filter(o => o.ownerId === u.id), x => x.value), false), m(revenueOf(O.filter(o => o.ownerId === u.id)), false), K.overdue.filter(l => l.ownerId === u.id).length]), chart: groupSum(K.open, o => uName(o.ownerId), o => o.value) };
    case 'sources': return { head: ['Source', 'Leads', 'Qualified', 'Qualification rate', 'Won revenue'], rows: SOURCES.map(s => { const l = L.filter(x => x.source === s), q = l.filter(x => x.status === 'Qualified'); return [s, l.length, q.length, pct(l.length ? q.length / l.length : 0), m(sum(K.won.filter(o => gLead(o.leadId).source === s), o => o.value), false)]; }).filter(r => r[1]), chart: groupSum(L, l => l.source, () => 1) };
    case 'customers': return { head: ['Company', 'Country', 'Type', 'Opportunities', 'Won', 'Won value'], rows: Q.companies().map(c => { const o = DB.opportunities.filter(x => x.companyId === c.id); return [c.name, gCtry(c.country).name, c.type, o.length, o.filter(isWon).length, m(revenueOf(o), false)]; }), chart: null };
    case 'suppliers': return { head: ['Supplier', 'Country', 'Status', 'Verification step', 'Rating', 'Last audit'], rows: DB.suppliers.map(s => [s.name, s.country, s.status, VERIF_STEPS[s.verifStep], s.rating || 'Not rated', s.lastAudit ? fmtD(s.lastAudit, 1) : 'None']), chart: groupSum(DB.suppliers, s => s.status, () => 1) };
    case 'quotes': return { head: ['Quote', 'Customer', 'Product', 'Total', 'Status', 'Incoterm', 'Sent'], rows: K.quotes.map(q => [q.number, (gComp(q.customerId) || {}).name, prodName(q.productId), m(q.total, false), q.status, q.incoterm, q.sentAt ? fmtD(q.sentAt, 1) : '—']), chart: groupSum(K.quotes, q => q.status, () => 1) };
    case 'deals': return { head: ['Deal', 'Country', 'Value', 'Probability', 'Stage', 'Owner'], rows: Q.deals().map(d => [d.name, gCtry(d.country).name, m(d.value, false), d.prob + '%', STAGE[d.stage].label, uName(d.ownerId)]), chart: null };
    case 'lost': return { head: ['Opportunity', 'Customer', 'Country', 'Value', 'Reason', 'Owner'], rows: K.lost.map(o => [o.id, gComp(o.companyId).name, gCtry(o.country).name, m(o.value, false), o.lostReason || 'Not recorded', uName(o.ownerId)]), chart: groupSum(K.lost, o => o.lostReason || 'Not recorded', () => 1) };
    case 'activities': return { head: ['Type', 'Count', 'Inbound', 'Last 7 days'], rows: ['Call', 'WhatsApp', 'Email', 'Meeting', 'Note', 'System'].map(t2 => { const a = Q.activities().filter(x => x.type === t2); return [t2, a.length, a.filter(x => x.dir === 'inbound').length, a.filter(x => daysSince(x.at) <= 7).length]; }), chart: groupSum(Q.activities(), a => a.type, () => 1) };
    case 'followups': return { head: ['Lead', 'Owner', 'Next follow-up', 'Status'], rows: L.filter(l => leadActive(l) && l.nextFollowUp).sort((a, b) => +new Date(a.nextFollowUp) - +new Date(b.nextFollowUp)).map(l => [l.company, uName(l.ownerId), fmtD(l.nextFollowUp, 1), isOverdue(l.nextFollowUp) ? 'Overdue ' + overdueDays(l.nextFollowUp) + 'd' : 'Scheduled']), chart: null };
    default: return { head: ['Branch', 'Leads', 'Open pipeline', 'Won revenue', 'Users'], rows: BRANCHES.filter(b => inScope(b.id)).map(b => [b.name, DB.leads.filter(l => l.branch === b.id).length, m(sum(DB.opportunities.filter(o => o.branch === b.id && isOpen(o)), o => o.value), false), m(revenueOf(DB.opportunities.filter(o => o.branch === b.id)), false), DB.users.filter(u => u.branch === b.id).length]), chart: BRANCHES.filter(b => inScope(b.id)).map(b => ({ k: b.name, v: sum(DB.opportunities.filter(o => o.branch === b.id && isOpen(o)), o => o.value) })) };
  }
}
VIEWS.reports = () => { const k = S.ui.report || 'sales', R = buildReport(k);
  return `${pageHeader(esc(navLabel('reports')), 'Filter, review, export to CSV or Excel, or print.', `${btn('Export CSV', 'reportExport', { d: { f: 'csv' }, ic: 'download' })}${btn('Export Excel', 'reportExport', { d: { f: 'xlsx' }, ic: 'download' })}${btn('Print / PDF', 'printPage', { ic: 'print' })}`)}${filterBar()}<div class="chips mb no-print">${Object.entries(REPORTS).map(([id, l]) => `<a class="chip ${k === id ? 'on' : ''}" data-act="pickReport" data-k="${id}">${l}</a>`).join('')}</div>
  <div class="print-only"><h2>RS Nexus — ${REPORTS[k]} report</h2><p>Generated ${fmtD(NOW, 1)} · DEMO data</p></div>${R.chart && R.chart.length ? `<div class="mb">${card(REPORTS[k] + ' overview', hbars(R.chart.slice(0, 10), { fmt: /Won|Spend|revenue|pipeline/i.test(R.head.join()) && k !== 'sources' && k !== 'leads' ? money : num }))}</div>` : ''}${card(REPORTS[k] + ' report — ' + R.rows.length + ' rows', `<div class="tw"><table class="t"><thead><tr>${R.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${R.rows.slice(0, 200).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${R.head.length}">${empty('No data', 'No rows for the current filters.')}</td></tr>`}</tbody></table></div>`, { style: 'padding:0' })}`; };

/* ===================== RS Nexus — optional Supabase sync (shared, real-time, multi-user data) =====================
 * Fill in CLOUD.url and CLOUD.anonKey below (Supabase → Project Settings → API) to turn on a real shared
 * backend. Leave them blank to keep the current local-only demo mode (localStorage, not shared between visitors).
 *
 * What this adds when configured:
 *  1) ONE shared JSON document (table `rsnexus_state`) holding the whole CRM dataset, kept in sync in real
 *     time across every browser that has this page open — a genuinely shared, multi-user dataset.
 *  2) Real sign-in via Supabase Auth (email + password) instead of the demo role picker. A signed-in email
 *     is matched to a row in DB.users by email so existing roles, branches and permissions keep working;
 *     an unmatched email is added as a new "SALES" user automatically (an admin can change their role from
 *     Team settings afterwards).
 *
 * Setup (see README.md for full steps):
 *  1. Create a free project at https://supabase.com
 *  2. In the SQL editor, run rsnexus-shared-state.sql (creates the table + Row Level Security policies)
 *  3. Project Settings → API → copy the "Project URL" and the "anon public" key into CLOUD below
 *  4. Authentication → Providers: make sure Email is enabled. Add teammates under Authentication → Users,
 *     or let them use "Create account" on the sign-in screen.
 *  5. Redeploy (git commit + push — Vercel redeploys automatically).
 *
 * This is a pragmatic first step toward a real backend: the whole dataset moves as one document, which is
 * simple and reliable for a small team. rsnexus-schema.sql has the fully normalized, per-table schema this
 * data model maps to, for a later migration to per-record Supabase queries and fine-grained RLS.
 */
const CLOUD = { url: '', anonKey: '' };
const cloudOn = () => !!(CLOUD.url && CLOUD.anonKey);
let sb = null, cloudSaving = false, cloudErr = '';

function boot() { if (cloudOn()) cloudBoot(); else init(); }

function loadSupabaseLib() {
  if (window.supabase) return Promise.resolve(window.supabase);
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = () => ok(window.supabase); s.onerror = no; document.head.appendChild(s); });
}
async function cloudBoot() {
  const app = document.getElementById('app');
  app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;color:#55657B;font:14px system-ui">Connecting to shared database…</div>';
  loadPrefs();
  try {
    const lib = await loadSupabaseLib();
    sb = lib.createClient(CLOUD.url, CLOUD.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    await cloudPullOrSeed();
    cloudSubscribe();
    sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') { S.userId = null; savePrefs(); render(true); } });
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user && session.user.email) matchCloudUser(session.user.email);
    S.route = parseHash(); render(true);
  } catch (e) {
    console.error(e); cloudErr = (e && e.message) || String(e);
    app.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#B8321F;font:14px system-ui"><div><b>Could not connect to the shared database.</b><br>Check CLOUD.url / CLOUD.anonKey and that rsnexus-shared-state.sql has been run.<br><span style="color:#55657B;font-size:12px">${esc(cloudErr)}</span></div></div>`;
  }
}
async function cloudPullOrSeed() {
  const { data, error } = await sb.from('rsnexus_state').select('data').eq('id', 'main').maybeSingle();
  if (error) throw error;
  if (data && data.data && Array.isArray(data.data.leads)) { DB = data.data; VER++; }
  else { DB = seedDB(); DB.settings = defaultSettings(); DB.notifications = buildNotifications(); const { error: e2 } = await sb.from('rsnexus_state').upsert({ id: 'main', data: DB }); if (e2) throw e2; }
}
function cloudSubscribe() {
  sb.channel('rsnexus_state_live').on('postgres_changes', { event: '*', schema: 'public', table: 'rsnexus_state', filter: 'id=eq.main' }, payload => {
    if (cloudSaving) return; const remote = payload.new && payload.new.data; if (!remote || !Array.isArray(remote.leads)) return;
    DB = remote; VER++; scoreCache.clear(); riskCache.clear(); toast('Updated — another teammate made changes'); render();
  }).subscribe();
}
window.cloudSave = debounce(async () => {
  if (!sb) return; cloudSaving = true;
  try { const { error } = await sb.from('rsnexus_state').upsert({ id: 'main', data: DB, updated_at: new Date().toISOString() }); if (error) console.error('Cloud save failed', error); }
  catch (e) { console.error('Cloud save failed', e); }
  setTimeout(() => cloudSaving = false, 500);
}, 700);

function matchCloudUser(email) {
  const u = DB.users.find(x => (x.email || '').toLowerCase() === email.toLowerCase());
  if (u) S.userId = u.id;
  else { const nu = { id: uid('u'), name: email.split('@')[0], role: 'SALES', branch: 'EG', title: 'Team member', email, active: true }; DB.users.push(nu); S.userId = nu.id; audit('User provisioned', 'users', nu.id, email); persistNow(); }
  savePrefs();
}
function cloudLoginHTML() {
  return `<h2>${esc(t('sign_in', 'Sign in'))}</h2><p class="muted" style="margin:4px 0 16px">Sign in with your work email. Data is shared live with your team.</p>
  <div class="field mb"><label>Email</label><input class="inp" id="cl_email" type="email" placeholder="you@rsholding.example" autocomplete="username"></div>
  <div class="field mb"><label>Password</label><input class="inp" id="cl_pass" type="password" autocomplete="current-password"></div>
  <button class="btn pri" style="width:100%;justify-content:center;padding:10px" data-act="cloudSignIn">${esc(t('sign_in', 'Sign in'))}${ic('arrow', 'sm')}</button>
  <button class="btn" style="width:100%;justify-content:center;padding:10px;margin-top:8px" data-act="cloudSignUp">Create account</button>
  <p class="xs faint" style="margin-top:14px">Company data is shared across everyone signed in. Company/customer/deal records are real once entered — enter real information carefully.</p>`;
}
ACT.cloudSignIn = async () => {
  const email = $('#cl_email').value.trim(), pass = $('#cl_pass').value; if (!email || !pass) return toast('Enter email and password', 1);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) return toast(error.message, 1);
  matchCloudUser(data.user.email); audit('Login', 'auth', S.userId, cur().role); location.hash = '#/dashboard'; S.route = parseHash(); render(true);
};
ACT.cloudSignUp = async () => {
  const email = $('#cl_email').value.trim(), pass = $('#cl_pass').value; if (!email || !pass) return toast('Enter email and password', 1); if (pass.length < 6) return toast('Password must be at least 6 characters', 1);
  const { data, error } = await sb.auth.signUp({ email, password: pass }); if (error) return toast(error.message, 1);
  if (data.session) { matchCloudUser(email); location.hash = '#/dashboard'; S.route = parseHash(); render(true); } else toast('Check your email to confirm your account, then sign in');
};
ACT.logout = async () => { if (sb) { try { await sb.auth.signOut(); } catch (e) { } } S.userId = null; savePrefs(); S.ui.menu = false; render(true); };
boot();
